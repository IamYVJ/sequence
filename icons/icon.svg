<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sequence">
  <!-- Felt table -->
  <rect width="512" height="512" fill="#07130E"/>
  <radialGradient id="felt" cx="50%" cy="0%" r="110%">
    <stop offset="0" stop-color="#0D2A1D"/>
    <stop offset="0.6" stop-color="#07130E"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#felt)"/>

  <!-- Board: a 5x5 hint of the grid, just enough to read as spaces -->
  <g stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3">
    <path d="M96 96H416M96 160H416M96 224H416M96 288H416M96 352H416M96 416H416"/>
    <path d="M96 96V416M160 96V416M224 96V416M288 96V416M352 96V416M416 96V416"/>
  </g>

  <!-- Five chips on the diagonal — the sequence itself -->
  <g fill="#F2C14E">
    <circle cx="128" cy="384" r="23"/>
    <circle cx="192" cy="320" r="23"/>
    <circle cx="256" cy="256" r="23"/>
    <circle cx="320" cy="192" r="23"/>
    <circle cx="384" cy="128" r="23"/>
  </g>
  <g fill="none" stroke="#07130E" stroke-opacity="0.45" stroke-width="4">
    <circle cx="128" cy="384" r="15"/>
    <circle cx="192" cy="320" r="15"/>
    <circle cx="256" cy="256" r="15"/>
    <circle cx="320" cy="192" r="15"/>
    <circle cx="384" cy="128" r="15"/>
  </g>
</svg>
